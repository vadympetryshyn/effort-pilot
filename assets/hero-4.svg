<g><rect x="660" y="176" width="26" height="24" rx="4" fill="#eaeef2"/><rect x="700" y="156" width="26" height="44" rx="4" fill="#eaeef2"/><rect x="740" y="136" width="26" height="64" rx="4" fill="#eaeef2"/><rect x="780" y="116" width="26" height="84" rx="4" fill="#eaeef2"/><rect x="820" y="96" width="26" height="104" rx="4" fill="#eaeef2"/><text x="673" y="220" text-anchor="middle" class="mono dim" style="font-size:11px">low</text><text x="713" y="220" text-anchor="middle" class="mono dim" style="font-size:11px">medium</text><text x="753" y="220" text-anchor="middle" class="mono dim" style="font-size:11px">high</text><text x="793" y="220" text-anchor="middle" class="mono dim" style="font-size:11px">xhigh</text><text x="833" y="220" text-anchor="middle" class="mono dim" style="font-size:11px">max</text></g>
  <g class="f f1 mono">
    <text x="32" y="98" class="you">&gt; let's plan a cache layer for the API</text>
    <text x="32" y="170"><tspan class="brand">⏵ effort  </tspan><tspan class="now" style="fill:#8250df">xhigh plan</tspan></text>
    <rect x="780" y="116" width="26" height="84" rx="4" fill="#8250df"/>
    <text x="32" y="200" class="dim">asks for a plan · classified in 1.2s</text>
  </g>
  <g class="f f2 mono">
    <text x="32" y="98" class="you">&gt; why are cache hits so low? check it and rework</text>
    <text x="32" y="170"><tspan class="brand">⏵ effort  </tspan><tspan class="old">xhigh plan → </tspan><tspan class="now" style="fill:#bc4c00">high analyze</tspan></text>
    <rect x="740" y="136" width="26" height="64" rx="4" fill="#bc4c00"/>
    <text x="32" y="200" class="dim">a cause to find, then a rework</text>
  </g>
  <g class="f f3 mono">
    <text x="32" y="98" class="you">&gt; looks good, implement the fix</text>
    <text x="32" y="170"><tspan class="brand">⏵ effort  </tspan><tspan class="old">xhigh plan → </tspan><tspan class="old">high analyze → </tspan><tspan class="now" style="fill:#0969da">medium implement</tspan></text>
    <rect x="700" y="156" width="26" height="44" rx="4" fill="#0969da"/>
    <text x="32" y="200" class="dim">building what was worked out</text>
  </g>
  <g class="f f4 mono">
    <text x="32" y="98" class="you">&gt; commit and push</text>
    <text x="32" y="170"><tspan class="brand">⏵ effort  </tspan><tspan class="old">high analyze → </tspan><tspan class="old">medium implement → </tspan><tspan class="now" style="fill:#1a7f37">low trivial</tspan></text>
    <rect x="660" y="176" width="26" height="24" rx="4" fill="#1a7f37"/>
    <text x="32" y="200" class="dim">a routine command: no deep thinking needed</text>
  </g>
