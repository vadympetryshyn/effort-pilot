<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Effort Pilot sets the effort per turn: xhigh to plan, high to investigate, medium to build, low to commit and push">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .you { fill: #1f2328; font-size: 17px; } .dim { fill: #656d76; font-size: 14px; }
    .brand { fill: #d97757; font-size: 16px; font-weight: 700; } .old { fill: #8c959f; font-size: 16px; }
    .now { font-size: 16px; font-weight: 700; }
    .f { opacity: 0; animation: show 12s infinite backwards; }
    .f2 { animation-delay: 3s; } .f3 { animation-delay: 6s; } .f4 { animation-delay: 9s; opacity: 1; }
    @keyframes show { 0% { opacity: 0; } 2% { opacity: 1; } 23% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .f { animation: none; } }
  </style>
