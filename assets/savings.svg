<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Effort Pilot versus always-on high effort: about 35% fewer tokens, 1.5 times faster replies, 20% fewer turns that fall short">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 20px; font-weight: 700; } .s { font-size: 13px; fill: #656d76; } .l { font-size: 16px; font-weight: 600; }
    .k { font-size: 12px; fill: #656d76; } .v { font-size: 26px; font-weight: 800; fill: #d97757; }
    .p { font-size: 13px; font-weight: 600; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; }
    .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
  </style>
  <rect x="1" y="1" width="898" height="378" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="48" class="h">Effort Pilot vs. always-on <tspan class="mono">high</tspan></text>
  <text x="868" y="48" text-anchor="end" class="s">≈ approximate</text>
  <rect x="32" y="64" width="12" height="12" rx="3" fill="#d0d7de"/><text x="52" y="75" class="k">always high</text>
  <rect x="140" y="64" width="12" height="12" rx="3" fill="#d97757"/><text x="160" y="75" class="k">Effort Pilot</text>
  <text x="32" y="122" class="l">Tokens &amp; cost</text><text x="32" y="142" class="s">per turn</text>
  <rect x="270" y="106" width="430" height="14" rx="7" fill="#d0d7de" class="bar"/>
  <rect x="270" y="128" width="279" height="14" rx="7" fill="#d97757" class="bar"/>
  <text x="868" y="134" text-anchor="end" class="v">−35%</text>
  <text x="32" y="200" class="l">Reply time</text><text x="32" y="220" class="s">model time per turn</text>
  <rect x="270" y="184" width="430" height="14" rx="7" fill="#d0d7de" class="bar d2"/>
  <rect x="270" y="206" width="288" height="14" rx="7" fill="#d97757" class="bar d2"/>
  <text x="868" y="212" text-anchor="end" class="v">1.5× faster</text>
  <text x="32" y="278" class="l">Turns that fall short</text><text x="32" y="298" class="s">the next message says “wrong”</text>
  <rect x="270" y="262" width="430" height="14" rx="7" fill="#d0d7de" class="bar d3"/>
  <rect x="270" y="284" width="344" height="14" rx="7" fill="#d97757" class="bar d3"/>
  <text x="868" y="290" text-anchor="end" class="v">−20%</text>
  <line x1="32" y1="326" x2="868" y2="326" stroke="#eaeef2"/>
  <text x="32" y="357" class="s">Effort per turn:</text>
  <rect x="140" y="340" width="115" height="26" rx="13" fill="#ede4ff"/><text x="152" y="358" class="p" style="fill:#6e40c9">plan → <tspan class="mono">xhigh</tspan></text>
  <rect x="265.2" y="340" width="161" height="26" rx="13" fill="#fff1e5"/><text x="277.2" y="358" class="p" style="fill:#bc4c00">investigate → <tspan class="mono">high</tspan></text>
  <rect x="436.0" y="340" width="130" height="26" rx="13" fill="#ddf4ff"/><text x="448.0" y="358" class="p" style="fill:#0969da">build → <tspan class="mono">medium</tspan></text>
  <rect x="576.4" y="340" width="130" height="26" rx="13" fill="#dafbe1"/><text x="588.4" y="358" class="p" style="fill:#1a7f37">question → <tspan class="mono">low</tspan></text>
</svg>
